<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Aditya Venkataraman</title>
  <meta name="description" content="Aditya Venkataraman — glaciers, climbing, puzzles, professional." />
  <meta name="color-scheme" content="light" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2032%2032'%3E%3Crect%20width='32'%20height='32'%20rx='7'%20fill='%2316232b'/%3E%3Cpath%20d='M4%2025%20L12%2010%20L17%2018%20L20%2013%20L28%2025%20Z'%20fill='%23cfe3ec'/%3E%3C/svg%3E" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700;800&family=Space+Grotesk:wght@400;500;700&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- faint topographic contour field, purely decorative -->
  <svg class="contours" viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid slice" aria-hidden="true" focusable="false">
    <g fill="none" stroke="currentColor" stroke-width="1.5">
      <path d="M-40 210 C 180 120 360 300 560 250 S 940 90 1260 200" />
      <path d="M-40 300 C 180 210 360 390 560 340 S 940 180 1260 290" />
      <path d="M-40 400 C 200 300 380 500 600 440 S 980 270 1260 390" />
      <path d="M-40 500 C 200 400 380 610 600 545 S 980 370 1260 500" />
      <path d="M-40 600 C 220 500 400 720 640 650 S 1000 470 1260 610" />
      <path d="M-40 700 C 220 610 420 820 660 760 S 1020 580 1260 720" />
    </g>
  </svg>

  <main class="hero">
    <h1 class="name" aria-label="Aditya Venkataraman">
      <span class="name__line">Aditya</span>
      <span class="name__line">Venkataraman</span>
    </h1>

    <figure class="portrait" id="portrait">
      <div class="portrait__glow" aria-hidden="true"></div>
      <div class="portrait__shadow" aria-hidden="true"></div>
      <div class="portrait__media">
        <picture>
          <source srcset="assets/adit1-cut.webp" type="image/webp" />
          <img
            class="portrait__img portrait__img--base"
            src="assets/adit1-cut.png"
            alt="Aditya Venkataraman"
            width="776" height="1000" fetchpriority="high" decoding="async"
          />
        </picture>
        <!-- gaze poses: he looks *toward* the cursor, so the cursor-left pose
             is the one glancing left, and vice versa -->
        <picture>
          <source srcset="assets/adit4-cut.webp" type="image/webp" />
          <img
            class="portrait__img portrait__img--left"
            src="assets/adit4-cut.png"
            alt="" aria-hidden="true"
            width="776" height="1000" decoding="async"
          />
        </picture>
        <picture>
          <source srcset="assets/adit3-cut.webp" type="image/webp" />
          <img
            class="portrait__img portrait__img--right"
            src="assets/adit3-cut.png"
            alt="" aria-hidden="true"
            width="776" height="1000" decoding="async"
          />
        </picture>
        <picture>
          <source srcset="assets/adit2-cut.webp" type="image/webp" />
          <img
            class="portrait__img portrait__img--alt"
            src="assets/adit2-cut.png"
            alt="" aria-hidden="true"
            width="776" height="1000" decoding="async"
          />
        </picture>
        <div class="portrait__eyes" id="emoji" aria-hidden="true">
          <span class="portrait__emoji portrait__emoji--l"></span>
          <span class="portrait__emoji portrait__emoji--r"></span>
        </div>
      </div>
    </figure>

    <div class="set" role="group" aria-label="What Aditya is into">
      <span class="set__brace" aria-hidden="true">{</span>
      <ul class="set__list">
        <li><a class="word" href="/glaciers" data-theme="glaciers" data-emoji="🧊">Glaciers</a></li>
        <li><a class="word" href="/climbing" data-theme="climbing" data-emoji="🪨">Climbing</a></li>
        <li><a class="word" href="/puzzles" data-theme="puzzles" data-emoji="🧩">Puzzles</a></li>
        <li><a class="word" href="/professional" data-theme="professional" data-emoji="📝">Professional</a></li>
      </ul>
      <span class="set__brace" aria-hidden="true">}</span>
    </div>

    <p class="hint" id="hint" hidden>Tap a word to hold it · tap again to release</p>
  </main>

  <footer class="foot">
    <a href="mailto:aditv2012@gmail.com">aditv2012@gmail.com</a>
    <!-- add socials when ready:
    <a href="https://github.com/USERNAME">GitHub</a>
    <a href="https://www.linkedin.com/in/USERNAME">LinkedIn</a>
    -->
  </footer>

  <script src="script.js"></script>
</body>
</html>
